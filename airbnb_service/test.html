<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebSocket Chat Test</title>
</head>
<body>
  <h2>🔧 Test WebSocket Chat 1-1</h2>

  <label>Username của bạn:</label>
  <input type="text" id="senderUsername" placeholder="john"><br><br>

  <label>Gửi đến (username người nhận):</label>
  <input type="text" id="receiverUsername" placeholder="alice"><br><br>

  <label>Nội dung tin nhắn:</label>
  <input type="text" id="content" placeholder="Xin chào"><br><br>

  <button onclick="sendMessage()">Gửi</button>

  <hr>
  <h3>Tin nhắn nhận được:</h3>
  <ul id="messages"></ul>

  <!-- SockJS & StompJS -->
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

  <script>
    let stompClient = null;
    let connected = false;

    function connect() {
      const sender = document.getElementById("senderUsername").value;
      if (!sender) {
        alert("Vui lòng nhập username của bạn");
        return;
      }

      const socket = new SockJS("http://127.0.0.1:8080/ws");
      stompClient = Stomp.over(socket);

      stompClient.connect({}, () => {
        console.log("✅ Kết nối thành công!");

        stompClient.subscribe("/user/" + sender + "/queue/messages", (message) => {
          const msg = JSON.parse(message.body);
          const li = document.createElement("li");
          li.textContent = `[${msg.senderUsername}] → ${msg.content}`;
          document.getElementById("messages").appendChild(li);
        });

        connected = true;
      }, (error) => {
        console.error("❌ Kết nối thất bại:", error);
      });
    }

    function sendMessage() {
      if (!connected) {
        connect();
        setTimeout(sendMessage, 1000);
        return;
      }

      const senderUsername = document.getElementById("senderUsername").value;
      const receiverUsername = document.getElementById("receiverUsername").value;
      const content = document.getElementById("content").value;

      const chatMessage = {
        senderUsername,
        receiverUsername,
        content,
        timestamp: new Date().toISOString()
      };

      stompClient.send("/app/chat", {}, JSON.stringify(chatMessage));
      document.getElementById("content").value = '';
    }

    // Kết nối khi người dùng nhập username và chuyển focus
    window.onload = () => {
      document.getElementById("senderUsername").addEventListener("blur", connect);
    };
  </script>
</body>
</html>
